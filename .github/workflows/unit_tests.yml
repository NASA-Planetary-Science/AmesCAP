name: Unit Test Workflow
# Fast, offline tests of the shared amescap modules
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ devel, main ]
    paths:
      - 'amescap/**'
      - 'pyproject.toml'
      - 'tests/test_fv3_utils.py'
      - 'tests/test_ncdf_wrapper.py'
      - 'tests/test_marsplot_utils.py'
      - 'tests/test_marsnest.py'
      - 'bin/MarsNest.py'
      - 'bin/MarsPlot.py'
      - '.github/workflows/unit_tests.yml'
  workflow_dispatch:
  pull_request:
    branches: [ devel, main ]
    paths:
      - 'amescap/**'
      - 'pyproject.toml'
      - 'tests/test_fv3_utils.py'
      - 'tests/test_ncdf_wrapper.py'
      - 'tests/test_marsplot_utils.py'
      - 'tests/test_marsnest.py'
      - 'bin/MarsNest.py'
      - 'bin/MarsPlot.py'
      - '.github/workflows/unit_tests.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: |
          cd tests
          python -m unittest -v test_fv3_utils.py test_ncdf_wrapper.py test_marsplot_utils.py test_marsnest.py
